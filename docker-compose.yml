version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/defiy.db
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - api-data:/data

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  api-data:
